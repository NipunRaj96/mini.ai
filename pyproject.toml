[project]
name = "mini-ai"
version = "0.1.0"
description = "A single, BYOK workspace for chatting with any provider's models, building your own agents, and letting multiple models/agents collaborate in one thread."
readme = "README.md"
authors = [{ name = "Nipun Kumar" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "arq>=0.26",
    "pgvector>=0.3",
    "fastembed>=0.8.0",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

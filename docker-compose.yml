services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: miniai
      POSTGRES_PASSWORD: miniai
      POSTGRES_DB: miniai
    ports:
      - "5432:5432"
    volumes:
      - miniai_pgdata:/var/lib/postgresql/data

volumes:
  miniai_pgdata:
